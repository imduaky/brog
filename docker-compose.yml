# brog in one container: nginx (gzip) in front of brog. Start with: docker compose up -d --build
# Open http://localhost:8080. The admin password is printed by `docker compose logs brog`.
#
# Set BROG_GITHUB_TOKEN in the environment (or a .env file next to this file) to enable comments.
services:
  brog:
    build: .
    image: ghcr.io/imduaky/brog:0.1.4
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      BROG_GITHUB_TOKEN: ${BROG_GITHUB_TOKEN:-}
    volumes:
      - brog-data:/app/data

volumes:
  brog-data:
