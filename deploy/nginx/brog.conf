# nginx in front of brog, with gzip. Used by docker-compose.yml, or mount it as
# /etc/nginx/conf.d/default.conf in your own setup (then point `server` at your brog).
#
# Behind this proxy, turn on "反向代理之后" in brog's settings (设置 → 服务): otherwise every
# visitor appears to come from nginx's address and they share one login/comment rate limit.

upstream brog {
    server brog:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # brog accepts image uploads up to 20 MB.
    client_max_body_size 25m;

    # gzip for text responses. Vary is added so a shared cache keeps the compressed and plain copies apart.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    location / {
        proxy_pass http://brog;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # git smart HTTP: pushes stream their request body and packs are already compressed,
    # so do not buffer or compress this path.
    location /git/ {
        proxy_pass http://brog;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        gzip off;
    }
}
