# nginx in front of brog, with gzip. The Docker image copies this file to
# /etc/nginx/conf.d/brog.conf and runs nginx in the same container as brog.
#
# brog listens on 127.0.0.1:8080 inside the container; only nginx (port 80) is reachable.
# X-Forwarded-For is set to the connecting address, overwriting any value the client sent.
# brog trusts that header in the image (BROG_TRUST_PROXY=1), so the rate limits see real visitors.

upstream brog {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # brog accepts image uploads up to 20 MB.
    client_max_body_size 25m;

    # gzip for text responses. Vary is added so a shared cache keeps the compressed and plain copies apart.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    location / {
        proxy_pass http://brog;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # git smart HTTP: pushes stream their request body and packs are already compressed,
    # so do not buffer or compress this path.
    location /git/ {
        proxy_pass http://brog;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        gzip off;
    }
}
